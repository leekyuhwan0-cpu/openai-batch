name: Poll OpenAI Batches

on:
  # bonus_ui.py가 배치 제출 직후 완료를 직접 감지해 workflow_dispatch로 즉시 깨움
  # (실측 2~3분 내). 이 schedule은 그 즉시-트리거가 놓친 경우(GUI 종료 등)를 위한
  # 저빈도 백업일 뿐 - */10으로 걸어놔도 GitHub이 실제론 최대 2시간 이상 지연시키는
  # 걸 확인해서(2026-09-11) 그 착각을 부르는 촘촘한 스케줄 대신 1시간으로 낮춤.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python poll_batches.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      # GitHub은 60일간 이 repo에 커밋(push)이 없으면 위 스케줄(cron) 자체를 자동으로
      # 꺼버린다 - "리포 활동"으로 인정되는 건 워크플로 실행이 아니라 실제 커밋이라
      # 45일에 한 번씩만 하트비트 커밋을 스스로 올려서 사람 개입 없이 영구히 살려둔다
      # (2026-09-11, 사용자가 수동으로 50일마다 커밋하는 대신 자동화하기로 함).
      - name: heartbeat commit (60일 자동비활성화 방지)
        run: |
          today=$(date -u +%s)
          last=0
          if [ -f last_run.txt ]; then
            last=$(date -u -d "$(cat last_run.txt)" +%s 2>/dev/null || echo 0)
          fi
          days=$(( (today - last) / 86400 ))
          if [ "$days" -ge 45 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > last_run.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last_run.txt
            git commit -m "heartbeat: keep scheduled cron alive"
            git push
          else
            echo "하트비트 불필요 (마지막 커밋 후 ${days}일)"
          fi
